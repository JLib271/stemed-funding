name: Correct a listing
description: A deadline, amount, link, or other detail that is wrong or out of date.
title: "Update: "
labels: ["update opportunity"]
body:
  - type: input
    id: listing
    attributes: {label: Which listing?, description: "Program name, or the file in opportunities/ if you know it."}
    validations: {required: true}
  - type: textarea
    id: change
    attributes: {label: What should change?}
    validations: {required: true}
  - type: input
    id: source
    attributes: {label: Where did you see the correct information?, description: "Ideally a link to the funder's page."}
