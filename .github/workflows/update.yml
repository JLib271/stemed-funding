name: Update and publish

# Every day: run the tests, check the listings in opportunities/, collect federal calls from
# Grants.gov, and publish the site to GitHub Pages. Pull requests only run the checks.
# Turn on once: Settings -> Pages -> Source: GitHub Actions.

on:
  schedule:
    - cron: "41 11 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: Check the listings in opportunities/
        run: python -m stemed_funding --validate

  publish:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Collect federal calls and build the site
        run: >-
          python -m stemed_funding
          --out output
          --previous "${{ steps.pages.outputs.base_url }}"
          --allow-errors
      - uses: actions/upload-pages-artifact@v5
        with:
          path: output
      - id: deployment
        uses: actions/deploy-pages@v5
